palette = "grey"
format = """$username$hostname$directory$fill[$all](white)$line_break$character"""

[directory]
style='white'

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vicmd_symbol = "[<](bold green)"

[fill]
symbol = '─'
style = 'orange'

[cmd_duration]
min_time = 10000

[time]
disabled = true
time_format = "%F %T"
style = "#444444"
format = '[$time]($style)'

[python]
symbol = "py "

[package]
symbol = "package "
style = "#777777"

[git_branch]
symbol = "git "

[aws]
symbol = "aws "

[terraform]
symbol = "tf "
style = "bold #777777"

